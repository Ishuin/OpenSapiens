name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate wrapper (not committed yet)
        run: gradle wrapper --gradle-version 8.9

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew test --continue 2>&1 | tee /tmp/gradle.log || {
            grep -E "^e: |error: |> Task .* FAILED|Caused by:|Could not |^   > |files found with path" /tmp/gradle.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Assemble debug APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :wear:assembleDebug 2>&1 | tee /tmp/gradle.log || {
            grep -E "^e: |error: |> Task .* FAILED|Caused by:|Could not |^   > |files found with path" /tmp/gradle.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload wear APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug
          path: wear/build/outputs/apk/debug/*.apk
